<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Biped · RL gait</title>
<meta name="description" content="A bipedal robot walking with a reinforcement-learned policy, simulated live in your browser (MuJoCo WASM).">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f1ede3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11110f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%23ff4f1f'/><path d='M26 18v16l-6 12M38 18v16l6 12' stroke='%23141412' stroke-width='6' fill='none' stroke-linecap='round'/></svg>">
<link rel="preload" href="../assets/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin>
<script>
  // language + mode before first paint: ?lang= → homepage choice (shared origin) → browser
  (() => {
    const q = new URLSearchParams(location.search), ok = ["zh", "en", "ja"];
    let l = q.get("lang");
    if (!ok.includes(l)) { try { l = localStorage.getItem("d66-lang"); } catch {} }
    if (!ok.includes(l)) l = /^ja/i.test(navigator.language) ? "ja" : /^zh/i.test(navigator.language) ? "zh" : "en";
    document.documentElement.lang = { zh: "zh-CN", en: "en", ja: "ja" }[l];
    document.documentElement.dataset.mode = q.has("embed") ? "embed" : "page";
    window.__lang = l;
  })();
</script>
<style>
  @font-face { font-family: "JetBrains Mono"; src: url(../assets/fonts/jetbrains-mono.woff2) format("woff2"); font-weight: 100 800; font-display: swap; }
  @font-face { font-family: "Space Grotesk"; src: url(../assets/fonts/space-grotesk.woff2) format("woff2"); font-weight: 300 700; font-display: swap; }
  :root {
    color-scheme: light;
    --paper: #f1ede3; --paper-2: #e8e2d4; --ink: #141412; --ink-2: #3b3a35; --muted: #7d7a70; --line: #14141222; --hard: #141412;
    --vermilion: #ff4f1f; --cobalt: #2747ff; --mint: #7dff9a;
    --bg: var(--paper); --fg: var(--ink); --panel: var(--paper); --edge: var(--ink); --dim: var(--muted);
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --sans: "Space Grotesk", "PingFang SC", "Hiragino Sans", "Microsoft YaHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --paper: #11110f; --paper-2: #1c1b18; --ink: #ece6da; --ink-2: #bcb7aa; --muted: #8a867b; --line: #ece6da24; --hard: #3a3832; --cobalt: #7b8fff; }
  }
  :root[data-mode="embed"] { --bg: #141412; --fg: #f1ede3; --panel: #141412d9; --edge: #f1ede333; --dim: #8d887b; --line: #f1ede322; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
               font: 14px/1.4 var(--sans); -webkit-user-select: none; user-select: none; touch-action: none; -webkit-font-smoothing: antialiased; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  .panel { position: fixed; background: var(--panel); border: 1.5px solid var(--edge); border-radius: 18px; }
  [data-mode="page"] .panel { box-shadow: 5px 5px 0 var(--hard); }
  [data-mode="embed"] .panel { backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-radius: 14px; }

  /* top bar (page) */
  #top { top: 16px; left: 16px; right: 16px; display: flex; align-items: center; gap: 10px; background: none; border: 0; box-shadow: none !important; pointer-events: none; }
  #top > * { pointer-events: auto; }
  .pill { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border: 1.5px solid var(--ink); border-radius: 99px;
          background: var(--paper); color: var(--ink); font: 600 13px var(--mono); text-decoration: none; letter-spacing: .02em; box-shadow: 3px 3px 0 var(--hard); }
  .pill:hover { background: var(--ink); color: var(--paper); }
  #top h1 { margin: 0 0 0 6px; font: 700 clamp(16px, 2.2vw, 22px)/1 var(--sans); letter-spacing: -.01em; }
  #top .sp { flex: 1; }
  #langBtn { cursor: pointer; }

  #hud { top: 72px; left: 16px; padding: 12px 14px; min-width: 260px; }
  [data-mode="embed"] #hud { top: 10px; left: auto; right: 10px; min-width: 210px; padding: 8px 10px; }
  .row { display: grid; grid-template-columns: 54px 1fr 50px; align-items: center; gap: 8px; margin: 5px 0; }
  .row .k { color: var(--dim); font-size: 12px; }
  .row .v { text-align: right; font: 500 12px var(--mono); font-variant-numeric: tabular-nums; }
  .bar { position: relative; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
  .bar i { position: absolute; top: 0; bottom: 0; left: 50%; width: 0; border-radius: 5px; }
  .bar i.cmd { background: var(--vermilion); opacity: .55; }
  .bar i.meas { background: var(--cobalt); height: 4px; top: 3px; }
  [data-mode="embed"] .bar i.meas { background: var(--mint); }
  .bar::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--dim); opacity: .6; }
  .legend { display: flex; gap: 12px; color: var(--dim); font-size: 11px; margin-top: 6px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 6px; border-radius: 3px; margin-right: 4px; vertical-align: middle; background: var(--vermilion); opacity: .7; }
  .legend span.m::before { background: var(--cobalt); opacity: 1; height: 3px; }
  [data-mode="embed"] .legend span.m::before { background: var(--mint); }
  .legend em { font-style: normal; margin-left: auto; font-family: var(--mono); }
  #falls { color: var(--dim); font-size: 12px; margin-top: 6px; display: flex; justify-content: space-between; gap: 10px; }
  #mode { font: 700 10.5px var(--mono); letter-spacing: .08em; color: var(--vermilion); }
  #mode.you { color: var(--cobalt); }
  [data-mode="embed"] #mode.you { color: var(--mint); }

  #help { top: 72px; right: 16px; padding: 12px 14px; font-size: 12px; color: var(--ink-2); max-width: 250px; }
  #help b { color: var(--ink); font-weight: 700; }
  #help kbd { display: inline-block; min-width: 20px; padding: 0 5px; border: 1.5px solid var(--ink); border-radius: 6px;
              text-align: center; font: 600 11px/17px var(--mono); color: var(--ink); background: var(--paper-2); }
  #help div { margin: 4px 0; }

  /* bottom-right dock: [more…] [push] ; on touch screens the strafe pad sits above it and "more" folds into a popover */
  #dock { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: flex-end; gap: 10px; z-index: 3; }
  #dock .panel { position: relative; }
  #buttons { padding: 8px; display: flex; gap: 8px; align-items: center; }
  #more { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  button, .sel { border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 99px;
           padding: 8px 15px; font: 600 13px var(--sans); cursor: pointer; touch-action: manipulation; white-space: nowrap; }
  button:hover { background: var(--paper-2); }
  button.primary { background: var(--ink); color: var(--paper); }
  button.hot { background: var(--vermilion); color: #141412; border-color: #141412; }
  button.off { opacity: .55; }
  .sel { display: inline-flex; align-items: center; gap: 6px; padding: 0 6px 0 14px; height: 38px; }
  .sel select { font: 600 13px var(--sans); color: inherit; background: transparent; border: 0; outline: 0; padding: 6px 4px; cursor: pointer; }
  .sel select option { color: #141412; background: #f1ede3; }
  #moreBtn { display: none; width: 44px; height: 44px; padding: 0; font: 800 18px/1 var(--mono); }
  #push { height: 44px; padding: 0 18px; font-weight: 700; }
  #full { display: none; }
  [data-mode="embed"] #dock { right: 10px; bottom: 10px; }
  [data-mode="embed"] #buttons { padding: 6px; gap: 6px; }
  [data-mode="embed"] #more { gap: 6px; }
  [data-mode="embed"] button { border-color: #f1ede355; background: transparent; color: #f1ede3; padding: 6px 12px; font: 600 11.5px var(--mono); }
  [data-mode="embed"] button:hover { background: #f1ede31a; }
  [data-mode="embed"] button.hot { background: var(--vermilion); color: #141412; border-color: var(--vermilion); }
  [data-mode="embed"] #push { height: auto; padding: 6px 12px; }
  [data-mode="embed"] #full { display: inline-block; }
  [data-mode="embed"] #follow, [data-mode="embed"] #autoBtn, [data-mode="embed"] #sound, [data-mode="embed"] .sel,
  [data-mode="embed"] #help, [data-mode="embed"] #top, [data-mode="embed"] #foot, [data-mode="embed"] #side { display: none !important; }

  #side { display: none; align-items: center; gap: 8px; padding: 6px; }
  #side span { font: 600 11px var(--mono); color: var(--dim); padding: 0 2px; }
  #side button { width: 48px; height: 44px; padding: 0; font-size: 16px; }

  #live { display: none; left: 10px; top: 10px; padding: 6px 10px; font: 600 10.5px/1.5 var(--mono); letter-spacing: .06em; color: #f1ede3; max-width: calc(100% - 250px); }
  #live b { color: var(--vermilion); font-weight: 700; margin-right: 8px; }
  #live b::before { content: "●"; margin-right: 6px; animation: blink 1s steps(1) infinite; }
  #live small { display: block; color: var(--dim); font-size: 10px; letter-spacing: .02em; }
  [data-mode="embed"] #live { display: block; }
  #hint { display: none; left: 10px; bottom: 10px; padding: 6px 10px; font: 500 10.5px var(--mono); color: var(--dim); max-width: calc(100% - 260px); }
  [data-mode="embed"] #hint { display: block; }
  @keyframes blink { 50% { opacity: 0; } }

  #foot { left: 16px; bottom: 16px; padding: 8px 12px; font: 500 11px/1.5 var(--mono); color: var(--ink-2); max-width: min(520px, calc(100% - 640px)); }
  @media (max-width: 1180px) { [data-mode="page"] #foot { display: none; } }

  #stick { left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom)); width: 150px; height: 150px; border-radius: 50%; display: none; }
  #stick .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px;
                 border-radius: 50%; background: var(--vermilion); border: 1.5px solid #141412; }
  #stick .lbl { position: absolute; font-size: 11px; color: var(--muted); }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
             gap: 14px; background: var(--bg); z-index: 10; transition: opacity .5s; }
  #loading .track { width: 240px; height: 8px; border-radius: 4px; border: 1.5px solid var(--fg); overflow: hidden; }
  #loading .track i { display: block; height: 100%; width: 0; background: var(--vermilion); transition: width .2s; }
  #loading .msg { color: var(--dim); font: 500 12px var(--mono); letter-spacing: .04em; }
  #loading.gone { opacity: 0; pointer-events: none; }
  #toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%) rotate(-2deg); padding: 8px 18px; border-radius: 99px;
           background: var(--vermilion); color: #141412; border: 1.5px solid #141412; opacity: 0; transition: opacity .25s;
           pointer-events: none; font: 700 14px var(--sans); z-index: 5; }

  /* phones / touch: joystick bottom-left, strafe pad + [⋯][push] bottom-right, everything else folded */
  @media (hover: none), (max-width: 760px) {
    [data-mode="page"] #help { display: none; }
    [data-mode="page"] #stick { display: block; }
    [data-mode="page"] #side { display: flex; }
    [data-mode="page"] #hud { min-width: 0; width: calc(100% - 32px); }
    [data-mode="page"] #moreBtn { display: inline-block; }
    [data-mode="page"] #more { display: none; position: absolute; right: 0; bottom: calc(100% + 10px); flex-direction: column; align-items: stretch;
                               flex-wrap: nowrap; padding: 8px; min-width: 190px; background: var(--paper); border: 1.5px solid var(--ink);
                               border-radius: 18px; box-shadow: 5px 5px 0 var(--hard); }
    [data-mode="page"] #buttons.open #more { display: flex; }
    [data-mode="page"] #buttons.open #moreBtn { background: var(--ink); color: var(--paper); }
    [data-mode="page"] #more > * { justify-content: space-between; text-align: left; }
    #top h1 { display: none; }
  }
  @media (max-width: 370px) { #stick { width: 128px; height: 128px; } #side button { width: 42px; } }
  @media (max-width: 560px) {
    [data-mode="embed"] #hud { display: none; }
    [data-mode="embed"] #live { max-width: calc(100% - 20px); }
    [data-mode="embed"] #hint { display: none; }
  }
</style>
<script type="importmap">{ "imports": { "three": "../assets/vendor/three.module.min.js", "three/addons/": "../assets/vendor/jsm/" } }</script>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>

<div id="loading"><div class="msg" id="loadmsg" data-t="loading">loading…</div><div class="track"><i id="loadbar"></i></div></div>

<div id="top" class="panel">
  <a class="pill" id="home" href="../" data-t="back">← dreaming66</a>
  <h1 data-t="title">Biped · RL gait</h1>
  <span class="sp"></span>
  <button class="pill" id="langBtn">ZH</button>
</div>

<div id="hud" class="panel">
  <div class="row"><span class="k" data-t="fwd">forward</span><div class="bar"><i class="cmd" id="b0c"></i><i class="meas" id="b0m"></i></div><span class="v" id="v0">0.00</span></div>
  <div class="row"><span class="k" data-t="side">strafe</span><div class="bar"><i class="cmd" id="b1c"></i><i class="meas" id="b1m"></i></div><span class="v" id="v1">0.00</span></div>
  <div class="row"><span class="k" data-t="turn">turn</span><div class="bar"><i class="cmd" id="b2c"></i><i class="meas" id="b2m"></i></div><span class="v" id="v2">0.00</span></div>
  <div class="legend"><span data-t="cmd">command</span><span class="m" data-t="meas">measured</span><em>m/s · rad/s</em></div>
  <div id="falls"><span id="fallN"></span><span id="mode"></span></div>
</div>

<div id="help" class="panel">
  <div data-t-html="h0"></div>
  <div><kbd>W</kbd><kbd>S</kbd> / <kbd>↑</kbd><kbd>↓</kbd> <span data-t="h1"></span></div>
  <div><kbd>A</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>→</kbd> <span data-t="h2"></span></div>
  <div><kbd>Q</kbd><kbd>E</kbd> <span data-t="h3"></span></div>
  <div><kbd>P</kbd> <span data-t="h4"></span> &nbsp; <kbd>R</kbd> <span data-t="h5"></span> &nbsp; <kbd>T</kbd> <span data-t="h6"></span> &nbsp; <kbd>M</kbd> <span data-t="h8"></span></div>
  <div style="margin-top:6px" data-t="h7"></div>
</div>

<div id="live" class="panel"><b>LIVE</b>MuJoCo 3.17 WASM · 50 Hz<small data-t="liveSub"></small></div>
<div id="hint" class="panel" data-t="hint"></div>
<div id="foot" class="panel" data-t-html="foot"></div>

<div id="stick" class="panel"><div class="knob" id="knob"></div>
  <span class="lbl" style="top:8px;left:50%;transform:translateX(-50%)" data-t="s0"></span>
  <span class="lbl" style="bottom:8px;left:50%;transform:translateX(-50%)" data-t="s1"></span>
  <span class="lbl" style="left:10px;top:50%;transform:translateY(-50%)" data-t="s2"></span>
  <span class="lbl" style="right:10px;top:50%;transform:translateY(-50%)" data-t="s3"></span>
</div>

<div id="dock">
  <div id="side" class="panel"><button id="sl" aria-label="strafe left">◀</button><span data-t="side">strafe</span><button id="sr" aria-label="strafe right">▶</button></div>
  <div id="buttons" class="panel">
    <div id="more">
      <button id="reset" data-t="reset">reset</button>
      <button id="autoBtn" data-t="auto">autopilot</button>
      <button id="follow" class="primary" data-t="follow">follow</button>
      <button id="sound">sound</button>
      <label class="sel"><span data-t="ground">ground</span><select id="ground"></select></label>
      <button id="full" data-t="full">full screen ↗</button>
    </div>
    <button id="moreBtn" aria-expanded="false" aria-controls="more" data-t-attr="aria-label:moreLbl">⋯</button>
    <button id="push" class="hot" data-t="push">push</button>
  </div>
</div>
<div id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
