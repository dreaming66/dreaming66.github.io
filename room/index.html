<style>
@font-face { font-family: "Instrument Serif"; src: url(../assets/fonts/instrument-serif.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: "Instrument Serif"; font-style: italic; src: url(../assets/fonts/instrument-serif-italic.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url(../assets/fonts/jetbrains-mono.woff2) format("woff2"); font-weight: 100 800; font-display: swap; }
@font-face { font-family: "Space Grotesk"; src: url(../assets/fonts/space-grotesk.woff2) format("woff2"); font-weight: 300 700; font-display: swap; }
@font-face { font-family: "Noto Serif SC"; src: url(../assets/fonts/noto-serif-sc-900.woff2) format("woff2"); font-weight: 700 900; font-display: swap; }
:root { --night: #0e0e0c; --paper: #f1ede3; --ink: #141412; --ink-2: #3b3a35; --brand: #fdb913; --ver: #ff4f1f; --mint: #7dff9a;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace; --sans: "Space Grotesk", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --serif: "Instrument Serif", "Noto Serif SC", Georgia, serif; --g: clamp(16px, 3.5vw, 48px); --ease: cubic-bezier(.23, 1, .32, 1); }
* { box-sizing: border-box; }
html { background: var(--night); }
body { margin: 0; background: var(--night); color: var(--paper); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: pan-y; }
#track { position: relative; pointer-events: none; }
.hud { position: fixed; z-index: 5; pointer-events: none; }
.hud > * { pointer-events: auto; }
.top { top: calc(14px + env(safe-area-inset-top)); left: var(--g); right: var(--g); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.pill { display: inline-flex; align-items: center; gap: 9px; height: 40px; padding: 0 15px 0 6px; border-radius: 99px; background: var(--paper); color: var(--ink); text-decoration: none; font: 700 14px var(--sans); border: 1px solid #14141222; }
.pill .mk { width: 28px; height: 28px; border-radius: 50%; background: var(--brand); display: grid; place-items: center; }
.pill .mk svg { width: 17px; height: 19px; fill: #141412; }
.chip { height: 40px; min-width: 40px; padding: 0 12px; border-radius: 99px; background: #f1ede31a; color: var(--paper); border: 1px solid #f1ede333; font: 700 12px var(--mono); cursor: pointer; backdrop-filter: blur(6px); }
.chip:hover { background: #f1ede333; }
.dots { right: calc(var(--g) - 4px); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 4px; }
.dots button { all: unset; cursor: pointer; display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 5px 4px; font: 600 10.5px var(--mono); letter-spacing: .08em; color: #f1ede380; }
.dots button i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; transition: .3s var(--ease); }
.dots button span { opacity: 0; transform: translateX(6px); transition: .3s var(--ease); }
.dots button:hover span, .dots button.on span { opacity: 1; transform: none; }
.dots button.on { color: var(--brand); }
.dots button.on i { background: var(--brand); transform: scale(1.25); }
.cards { left: var(--g); bottom: calc(var(--g) + env(safe-area-inset-bottom)); width: min(430px, calc(100vw - 2 * var(--g))); }
.card { position: absolute; left: 0; bottom: 0; width: 100%; background: var(--paper); color: var(--ink); border: 1.5px solid var(--ink); border-radius: 20px; padding: 18px 20px 18px; box-shadow: 6px 6px 0 #000; opacity: 0; transform: translateY(14px); transition: opacity .45s var(--ease), transform .45s var(--ease); pointer-events: none; }
.card.on { opacity: 1; transform: none; pointer-events: auto; }
.card .tag { font: 800 10.5px var(--mono); letter-spacing: .12em; color: var(--ver); }
.card h2 { margin: 6px 0 6px; font: 400 clamp(28px, 3.4vw, 40px)/1.05 var(--serif); letter-spacing: -.01em; }
html[lang="zh-CN"] .card h2, html[lang="ja"] .card h2 { font: 900 clamp(24px, 2.8vw, 32px)/1.2 "Noto Serif SC", var(--serif); }
.card p { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.card .go { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.card .go a { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 6px 0 14px; border-radius: 99px; border: 1.5px solid var(--ink); text-decoration: none; font: 600 13px var(--sans); color: var(--ink); background: var(--paper); }
.card .go a b { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-weight: 400; }
.card .go a.ink { background: var(--ink); color: var(--paper); }
.card .go a.ink b { background: var(--brand); color: var(--ink); }
.hint { left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); font: 600 10.5px var(--mono); letter-spacing: .14em; color: #f1ede399; transition: opacity .5s; text-align: center; }
.hint i { display: block; width: 1.5px; height: 26px; margin: 6px auto 0; background: linear-gradient(var(--brand), transparent); animation: drip 1.6s var(--ease) infinite; }
@keyframes drip { from { transform: scaleY(0); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } 51% { transform-origin: bottom; } to { transform: scaleY(0); transform-origin: bottom; } }
.bracket { position: fixed; z-index: 4; pointer-events: none; opacity: 0; transition: opacity .2s; }
.bracket.on { opacity: 1; }
.bracket i { position: absolute; width: 14px; height: 14px; border: 2px solid var(--brand); }
.bracket i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; }
.bracket i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; }
.bracket i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; }
.bracket i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; }
.bracket span { position: absolute; left: 0; top: -24px; white-space: nowrap; font: 700 10.5px var(--mono); letter-spacing: .08em; background: var(--brand); color: var(--ink); padding: 3px 8px; border-radius: 4px; }
.bracket.cue i { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.load { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: var(--night); transition: opacity .7s, visibility .7s; font: 600 11px var(--mono); letter-spacing: .14em; color: #f1ede399; }
.load.off { opacity: 0; visibility: hidden; }
.load svg { width: 64px; height: 70px; fill: var(--brand); display: block; margin: 0 auto 16px; animation: bob 1.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
body.has-hover #gl { cursor: pointer; }
@media (max-width: 720px) {
  .dots { display: none; }
  .card { padding: 15px 16px; border-radius: 16px; box-shadow: 4px 4px 0 #000; }
  .card p { font-size: 13.5px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .hint i, .load svg { animation: none; } }
</style>
